<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f3ecd9;
    --paper-line: #e4d9bd;
    --card: #fffdf6;
    --card-edge: #e9e0c8;
    --ink: #33302a;
    --ink-dim: #8a8172;
    --pencil: #4a5a78;
    --tape-a: #cfe0e8;
    --tape-b: #f6dfa8;
    --shadow: rgba(60, 50, 30, 0.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height:100%; overscroll-behavior-y: contain; }
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 14px;
    padding-top: max(14px, env(safe-area-inset-top));
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    background:
      repeating-linear-gradient(
        var(--paper) 0px, var(--paper) 27px,
        var(--paper-line) 28px
      );
    background-color: var(--paper);
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  input, textarea{ -webkit-user-select: text; user-select: text; }
  .hand{ font-family:'Yomogi', cursive; }

  .deco{
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }
  .deco-tl{ top: 24px; left: 18px; width: 40px; height: 60px; }
  .deco-tr{ top: 40px; right: 24px; width: 64px; height: 32px; }
  .deco-br{ bottom: 20px; right: 10px; width: 110px; height: 110px; }
  @media (max-height: 700px){
    .deco{ display:none; }
  }

  /* ---------- Landing: choose notebook ---------- */
  #landing{
    display:none;
    max-width: 420px;
    width:100%;
    text-align:center;
  }
  .app-title{
    font-family:'Yomogi', cursive;
    font-size: 40px;
    margin: 0 0 4px;
    color: var(--ink);
  }
  #landing .app-title{ margin-bottom: 34px; }
  .app-sub{
    font-size: 12.5px;
    color: var(--ink-dim);
    margin: 0 0 32px;
  }
  .book-row{
    display:flex;
    gap: 18px;
    justify-content:center;
    margin-bottom: 26px;
  }
  .book{
    flex:1;
    height: 150px;
    border-radius: 6px 10px 10px 6px;
    cursor:pointer;
    position:relative;
    box-shadow:
      0 14px 26px var(--shadow),
      4px 6px 0 0 var(--card-edge),
      8px 12px 0 0 var(--paper-line);
    transition: transform .18s ease, box-shadow .18s ease;
    border:none;
    padding:0;
    overflow:hidden;
    margin: 0 8px 10px 0;
  }
  .book:hover{
    transform: translateY(-4px);
    box-shadow:
      0 20px 34px var(--shadow),
      4px 6px 0 0 var(--card-edge),
      8px 12px 0 0 var(--paper-line);
  }
  .book.a{ background: linear-gradient(160deg, #7f97b8, #566d8f); }
  .book.b{ background: linear-gradient(160deg, #e0b96e, #c3903f); }
  .book .spine{
    position:absolute; left:0; top:0; bottom:0; width:14px;
    background: rgba(0,0,0,0.18);
  }
  .book .label{
    position:absolute;
    left: 26px; right: 14px; top: 50%;
    transform: translateY(-50%);
    text-align:left;
    color: #fff;
    font-family:'Yomogi', cursive;
    font-size: 18px;
    text-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .book .label small{
    display:block;
    font-family:'Noto Sans JP', sans-serif;
    font-size: 11px;
    opacity: .85;
    margin-top: 4px;
    font-weight:400;
  }
  .hint{
    font-size: 11.5px;
    color: var(--ink-dim);
    line-height: 1.8;
  }

  /* ---------- PIN screen ---------- */
  #pinScreen{
    display:block;
    max-width: 340px;
    width:100%;
    text-align:center;
  }
  #pinScreen .pin-title{
    font-family:'Yomogi', cursive;
    font-size: 19px;
    margin: 0 0 6px;
  }
  #pinScreen .pin-sub{
    font-size: 11.5px;
    color: var(--ink-dim);
    margin: 0 0 18px;
  }
  #pinInput{
    width: 170px;
    text-align:center;
    letter-spacing: 10px;
    font-size: 24px;
    font-family: 'Noto Sans JP', sans-serif;
    padding: 12px 0 12px 10px;
    border-radius: 8px;
    border: 1px solid var(--card-edge);
    background: var(--card);
    color: var(--ink);
    outline:none;
    margin-bottom: 14px;
  }
  #pinInput:focus{ border-color: var(--pencil); }
  #pinInput.shake{ animation: shake .35s ease; border-color:#c05a4a; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }
  #pinGo{
    display:block;
    width: 100%;
    background: var(--pencil);
    border:none;
    color:#fff;
    font-weight:500;
    border-radius:10px;
    padding: 14px 0;
    cursor:pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size:14.5px;
    margin-bottom: 12px;
  }
  #pinGo:disabled{ opacity:.4; cursor:default; }
  #pinError{
    font-size: 11.5px;
    color: #c05a4a;
    min-height: 16px;
    margin-bottom: 8px;
  }

  /* ---------- Debug panel (5-tap on title) ---------- */
  #debugPanel{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(23,20,15,0.92);
    color: #f3ecd9;
    z-index: 999;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    font-family: 'Noto Sans JP', sans-serif;
    overflow-y: auto;
  }
  #debugPanel .dbg-title{
    font-family:'Yomogi', cursive;
    font-size: 20px;
    margin: 0 0 14px;
  }
  #debugPanel .dbg-line{ font-size: 12.5px; margin: 0 0 14px; color:#cfc6b4; }
  #debugPanel .dbg-line b{ color:#f3ecd9; font-family:'JetBrains Mono', monospace; }
  #dbgPing{
    display:block;
    width:100%;
    background: var(--ember, #e0b96e);
    color:#1a1208;
    border:none;
    border-radius:10px;
    padding: 12px 0;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-bottom: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: transform .08s ease, opacity .08s ease;
  }
  #dbgPing:active{ transform: scale(0.97); opacity: 0.85; }
  #dbgPing:disabled{ opacity: 0.5; }
  #dbgLog{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    line-height:1.7;
    white-space: pre-wrap;
    word-break: break-all;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 12px;
    min-height: 120px;
    margin-bottom: 16px;
  }
  #dbgClose{
    display:block;
    width:100%;
    background:none;
    border: 1px solid #55503f;
    color:#cfc6b4;
    border-radius:10px;
    padding: 10px 0;
    font-size:13px;
    cursor:pointer;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* looks like an idle doodle in the margin of the page - it isn't */
  #wipeDoodle{
    position: fixed;
    right: max(22px, env(safe-area-inset-right));
    bottom: max(22px, env(safe-area-inset-bottom));
    width: 50px;
    height: 50px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    opacity: 0.75;
    transform: rotate(-6deg);
    transition: transform .15s ease, opacity .15s ease;
  }
  #wipeDoodle svg{ width:100%; height:100%; }
  #wipeDoodle:hover{ opacity: 1; transform: rotate(-6deg) scale(1.06); }
  #wipeDoodle.zapped{ animation: zap .5s ease; }
  @keyframes zap{
    0%{ transform: rotate(-6deg) scale(1); }
    40%{ transform: rotate(8deg) scale(1.25); }
    100%{ transform: rotate(-6deg) scale(1); opacity: 0.75; }
  }

  /* ---------- Notepad screen ---------- */
  #pad, #realPad{
    display:none;
    flex-direction:column;
    width:100%;
    max-width: 460px;
    height: 92dvh;
    max-height: 820px;
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 24px 60px var(--shadow);
    overflow:hidden;
    position:relative;
  }
  .rings{
    display:flex;
    justify-content:space-evenly;
    padding: 10px 26px 0;
    background: var(--card);
  }
  .rings span{
    width: 12px; height: 12px;
    border-radius:50%;
    background: var(--paper);
    box-shadow: inset 0 2px 3px rgba(0,0,0,.18);
  }
  header.padtop{
    padding: 6px 22px 14px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 1px solid var(--card-edge);
  }
  header.padtop .name{
    font-family:'Yomogi', cursive;
    font-size: 20px;
  }
  header.padtop .which{
    font-size: 11px;
    color: var(--ink-dim);
    padding: 2px 7px;
    border-radius: 6px;
    border: 1.5px solid transparent;
    transition: border-color .2s ease, color .2s ease;
  }
  header.padtop .which.awaiting{
    border-color: #c0524a;
    color: #c0524a;
    font-weight: 500;
  }
  header.padtop .hdr-right{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .close-link{
    background: var(--card);
    border: 1px solid var(--card-edge);
    color: var(--ink-dim);
    font-size: 11px;
    cursor:pointer;
    padding: 5px 12px;
    border-radius: 999px;
    font-family: 'Noto Sans JP', sans-serif;
    box-shadow: 0 1px 3px rgba(60,50,30,0.08);
  }
  .close-link:active{ transform: scale(.96); }

  #sheet, #realSheet{
    flex:1;
    overflow-y:auto;
    padding: 18px 20px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  #sheet::-webkit-scrollbar, #realSheet::-webkit-scrollbar{ width:6px; }
  #sheet::-webkit-scrollbar-thumb, #realSheet::-webkit-scrollbar-thumb{ background: var(--card-edge); border-radius:3px; }

  .empty{
    margin:auto;
    text-align:center;
    color: var(--ink-dim);
    font-size:12.5px;
    line-height:1.9;
  }

  .note{
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 3px;
    padding: 12px 14px 10px;
    font-size: 14.5px;
    line-height: 1.6;
    position:relative;
    box-shadow: 0 3px 8px rgba(60,50,30,0.08);
    animation: land .22s ease;
  }
  @keyframes land{
    from{ opacity:0; transform: translateY(6px) rotate(0deg); }
    to{ opacity:1; transform: translateY(0); }
  }
  .note.tilt-l{ transform: rotate(-0.6deg); }
  .note.tilt-r{ transform: rotate(0.6deg); }
  .note .tape{
    position:absolute; top:-7px; left: 16px;
    width: 34px; height: 14px;
    opacity:.9;
    transform: rotate(-3deg);
  }
  .note.mine .tape{ background: var(--tape-a); }
  .note.theirs .tape{ background: var(--tape-b); }
  .note.plain .tape{ background: var(--card-edge); }
  .note .body{ white-space: pre-wrap; word-break: break-word; }
  .note .stamp{
    display:block;
    margin-top: 6px;
    font-size: 10px;
    color: var(--ink-dim);
    text-align:right;
  }
  .note .del{
    position:absolute;
    top: 6px; right: 8px;
    background:none;
    border:none;
    color: var(--ink-dim);
    font-size: 15px;
    line-height:1;
    cursor:pointer;
    padding: 4px 6px;
  }
  .note .del:hover{ color: #c0524a; }

  /* signature moment: a read note gets crossed out, then lifted away and gone */
  .note.consuming .body{
    text-decoration: line-through;
    text-decoration-color: var(--pencil);
    transition: text-decoration-color .3s ease;
  }
  .note.tossed{
    animation: toss .85s ease forwards;
    pointer-events:none;
  }
  @keyframes toss{
    0%{ opacity:1; transform: translateY(0) rotate(0deg) scale(1); }
    100%{ opacity:0; transform: translateY(-22px) rotate(6deg) scale(0.85); filter: blur(2px); }
  }

  form#composer, form#realComposer{
    display:flex;
    gap: 8px;
    padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--card-edge);
    background: var(--card);
  }
  #text, #realText{
    flex:1;
    background: var(--paper);
    border: 1px solid var(--card-edge);
    border-radius: 10px;
    color: var(--ink);
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    outline:none;
    resize:none;
  }
  #text:focus, #realText:focus{ border-color: var(--pencil); }
  #addBtn, #realAddBtn{
    background: var(--pencil);
    border:none;
    color:#fff;
    font-weight:500;
    border-radius:10px;
    padding: 0 20px;
    cursor:pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size:14px;
    min-width: 60px;
  }
  #addBtn:active, #realAddBtn:active{ transform: scale(.97); }
  #addBtn:disabled, #realAddBtn:disabled{ opacity:.4; cursor:default; }

  #photoBtn{
    background: none;
    border: 1px solid var(--card-edge);
    color: var(--pencil);
    border-radius: 10px;
    width: 44px;
    flex-shrink: 0;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #photoBtn svg{ width: 20px; height: 20px; }
  #photoBtn:active{ transform: scale(.94); }
  #photoBtn:disabled{ opacity:.4; cursor:default; }

  .note img{
    display:block;
    max-width: 100%;
    max-height: 260px;
    border-radius: 6px;
    margin-top: 2px;
  }
  .note .uploading{
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
</style>

</head>
<body>

<svg class="deco deco-tl" viewBox="0 0 60 90" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M20 8 C36 8, 40 22, 40 34 L40 62 C40 74, 30 80, 22 74 C15 69, 16 60, 24 58 L24 30"
        fill="none" stroke="#8a8172" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>

<svg class="deco deco-br" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <circle cx="60" cy="60" r="42" fill="none" stroke="#8a8172" stroke-width="3" opacity="0.16"/>
  <circle cx="60" cy="60" r="42" fill="none" stroke="#8a8172" stroke-width="2" opacity="0.1" transform="rotate(8 60 60)"/>

<svg class="deco deco-tr" viewBox="0 0 80 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        fill="none" stroke="#4a5a78" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>

<div id="landing">
  <p class="app-title">メモ</p>
  <div class="book-row">
    <button class="book a" data-id="A">
      <span class="spine"></span>
      <span class="label">仕事<small>開く</small></span>
    </button>
    <button class="book b" data-id="B">
      <span class="spine"></span>
      <span class="label">プライベート<small>開く</small></span>
    </button>
  </div>
  <p class="hint">使うノートを選んでください。</p>
</div>

<div id="pinScreen">
  <p class="app-title hand" id="pinAppTitle" style="font-size:28px;">メモ帳</p>
  <p class="pin-title" id="pinTitle">確認コード</p>
  <p class="pin-sub" id="pinSub">4桁のコードを入力してください</p>
  <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
  <p id="pinError"></p>
  <button id="pinGo">開く</button>
</div>

<button id="wipeDoodle" type="button" aria-label="doodle">
  <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 12
             C 42 12, 49 20, 48 30
             C 47 41, 38 48, 28 47
             C 18 46, 11 38, 12 28
             C 13 17, 22 10, 33 13
             C 40 15, 44 21, 43 27"
          fill="none" stroke="#c0524a" stroke-width="2.6"
          stroke-linecap="round" />
  </svg>
</button>

<div id="debugPanel">
  <p class="dbg-title">通信テスト</p>
  <p class="dbg-line">この端末のID: <b id="dbgMe"></b></p>
  <button id="dbgPing" type="button">PINGを送信</button>
  <div class="dbg-log" id="dbgLog"></div>
  <button id="dbgClose" type="button">閉じる</button>
</div>

<div id="pad">
  <div class="rings"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header class="padtop">
    <span class="name">メモ</span>
    <div class="hdr-right">
      <span class="which" id="whichNote"></span>
      <button id="padClose" type="button" class="close-link">閉じる</button>
    </div>
  </header>
  <div id="sheet">
    <div class="empty" id="emptyMsg">メモはありません。</div>
  </div>
  <form id="composer">
    <button id="photoBtn" type="button" aria-label="add photo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <circle cx="12" cy="14" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      </svg>
    </button>
    <input id="photoInput" type="file" accept="image/*" style="display:none;">
    <textarea id="text" rows="1" placeholder="ここにメモを書く…" maxlength="1000"></textarea>
    <button id="addBtn" type="submit">追加</button>
  </form>
</div>

<div id="realPad">
  <div class="rings"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <header class="padtop">
    <span class="name">メモ</span>
    <button id="realBack" type="button" class="close-link">閉じる</button>
  </header>
  <div id="realSheet">
    <div class="empty" id="realEmptyMsg">メモはありません。</div>
  </div>
  <form id="realComposer">
    <textarea id="realText" rows="1" placeholder="ここにメモを書く…" maxlength="2000"></textarea>
    <button id="realAddBtn" type="submit">追加</button>
  </form>
</div>

<script>
(function(){
  const NTFY_TOPIC = 'kienote-dcdfafd16282cfeebab8';
  const NTFY_BASE = 'https://ntfy.sh/' + NTFY_TOPIC;

  // every network call gets a hard timeout so a flaky connection shows an
  // error instead of leaving the UI looking permanently frozen
  async function fetchTimeout(url, opts, ms){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), ms || 8000);
    try{
      return await fetch(url, Object.assign({}, opts, { signal: controller.signal }));
    }finally{
      clearTimeout(timer);
    }
  }

  let myId = null;
  let otherId = null;
  const seenIds = new Set();

  // "cutoff" is a unix-seconds timestamp persisted in this browser: notes at
  // or before it are considered permanently read and are never shown again,
  // even across reloads or re-logins on this device.
  const CUTOFF_KEY = 'kie-note:cutoff';
  function getCutoff(){
    try{ return localStorage.getItem(CUTOFF_KEY); }catch(e){ return null; }
  }
  function setCutoff(unixSeconds){
    try{ localStorage.setItem(CUTOFF_KEY, String(unixSeconds)); }catch(e){ /* private mode etc - degrade silently */ }
  }
  function advanceCutoff(unixSeconds){
    const current = parseInt(getCutoff() || '0', 10);
    if(isNaN(current) || unixSeconds >= current){
      setCutoff(unixSeconds + 1); // +1 so this exact second's message isn't replayed next time
    }
  }

  let entrySince = getCutoff() || 'all'; // resume from where this device last left off

  // "whose turn" tracking: remembers who sent the most recent message, so a
  // border can be shown on the header even after the message itself has
  // already vanished - clears only when this device sends a reply, not just
  // when the message is viewed.
  const TURN_SENDER_KEY = 'kie-note:turn-sender';
  const TURN_TS_KEY = 'kie-note:turn-ts';
  function getTurnState(){
    try{
      return {
        sender: localStorage.getItem(TURN_SENDER_KEY),
        ts: parseInt(localStorage.getItem(TURN_TS_KEY) || '0', 10)
      };
    }catch(e){ return { sender: null, ts: 0 }; }
  }
  function noteTurn(sender, ts){
    const cur = getTurnState();
    if(!ts || ts >= cur.ts){
      try{
        localStorage.setItem(TURN_SENDER_KEY, sender);
        localStorage.setItem(TURN_TS_KEY, String(ts || Date.now()));
      }catch(e){ /* private mode etc - degrade silently */ }
      updateTurnBadge();
    }
  }
  function updateTurnBadge(){
    if(!myId) return;
    const cur = getTurnState();
    whichNote.classList.toggle('awaiting', cur.sender === otherId);
  }

  const landing = document.getElementById('landing');
  const pinScreen = document.getElementById('pinScreen');
  const pinTitle = document.getElementById('pinTitle');
  const pinSub = document.getElementById('pinSub');
  const pinInput = document.getElementById('pinInput');
  const pinError = document.getElementById('pinError');
  const pinGo = document.getElementById('pinGo');
  const wipeDoodle = document.getElementById('wipeDoodle');
  const pinAppTitle = document.getElementById('pinAppTitle');
  const debugPanel = document.getElementById('debugPanel');
  const dbgMe = document.getElementById('dbgMe');
  const dbgPing = document.getElementById('dbgPing');
  const dbgLog = document.getElementById('dbgLog');
  const dbgClose = document.getElementById('dbgClose');
  const pad = document.getElementById('pad');
  const padClose = document.getElementById('padClose');
  const sheet = document.getElementById('sheet');
  const emptyMsg = document.getElementById('emptyMsg');
  const whichNote = document.getElementById('whichNote');
  const composer = document.getElementById('composer');
  const textEl = document.getElementById('text');
  const addBtn = document.getElementById('addBtn');
  const photoBtn = document.getElementById('photoBtn');
  const photoInput = document.getElementById('photoInput');

  const APP_PIN = '0718';
  const DECOY_PIN = '0283';
  const DECOY_PIN_2 = '0725';
  const NTFY_DEBUG_TOPIC = NTFY_TOPIC + '-debug';
  const deviceId = Math.random().toString(36).slice(2, 6).toUpperCase();
  let debugEventSource = null;

  pinInput.focus();

  // --- debug panel: tap the title 5 times to open a cross-device ping test ---
  let tapCount = 0;
  let tapTimer = null;
  pinAppTitle.addEventListener('click', ()=>{
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 1500);
    if(tapCount >= 5){
      tapCount = 0;
      openDebugPanel();
    }
  });

  function openDebugPanel(){
    dbgMe.textContent = deviceId;
    debugPanel.style.display = 'block';
    dbgLog.textContent = '接続中…';

    debugEventSource = new EventSource('https://ntfy.sh/' + NTFY_DEBUG_TOPIC + '/sse');
    debugEventSource.onopen = ()=>{
      if(dbgLog.textContent === '接続中…'){
        dbgLog.textContent = '接続できました。もう一方の端末でも同じ画面を開き「PINGを送信」を押してみてください。';
      }
    };
    debugEventSource.onmessage = (e)=>{
      let evt;
      try{ evt = JSON.parse(e.data); }catch(err){ return; }
      let latest;
      try{ latest = JSON.parse(evt.message); }catch(err){ return; }
      if(!latest || !latest.from) return;
      const now = new Date().toLocaleTimeString('ja-JP');
      const age = Math.round((Date.now() - latest.ts) / 1000);
      dbgLog.textContent =
        '受信しました:\n' + JSON.stringify(latest, null, 2) +
        '\n\n受信からの経過: ' + age + '秒前' +
        '\n(最終確認: ' + now + ')';
    };
    debugEventSource.onerror = ()=>{
      dbgLog.textContent = '接続エラー: ntfy.sh に接続できません。\nこの端末のネット接続を確認してください。';
    };
  }

  function closeDebugPanel(){
    debugPanel.style.display = 'none';
    if(debugEventSource){
      debugEventSource.close();
      debugEventSource = null;
    }
  }

  dbgClose.addEventListener('click', closeDebugPanel);

  dbgPing.addEventListener('click', async ()=>{
    dbgPing.disabled = true;
    dbgLog.textContent = '送信中…';
    const payload = { from: deviceId, ts: Date.now() };
    try{
      await fetchTimeout('https://ntfy.sh/' + NTFY_DEBUG_TOPIC, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      dbgLog.textContent = '送信しました:\n' + JSON.stringify(payload, null, 2) + '\n\n(反映まで数秒、受信すれば自動で表示が変わります)';
    }catch(e){
      const isAbort = e && e.name === 'AbortError';
      dbgLog.textContent = (isAbort ? '送信タイムアウト（8秒応答なし）' : '送信エラー: ネットワークに問題がある可能性があります。') + '\n' + String(e);
    }finally{
      dbgPing.disabled = false;
    }
  });

  function trySubmitPin(){
    const val = pinInput.value.trim();
    if(!/^\d{4}$/.test(val)){
      showPinError('4桁の数字を入力してください');
      return;
    }
    if(val === APP_PIN){
      unlockLanding();
    }else if(val === DECOY_PIN){
      openRealNotes('kie-note:real-notes:0283');
    }else if(val === DECOY_PIN_2){
      openRealNotes('kie-note:real-notes:0725');
    }else{
      showPinError('コードが違います');
      pinInput.value = '';
      pinInput.classList.remove('shake');
      void pinInput.offsetWidth;
      pinInput.classList.add('shake');
    }
  }

  function showPinError(msg){
    pinError.textContent = msg;
  }

  pinGo.addEventListener('click', trySubmitPin);
  pinInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') trySubmitPin();
  });

  // looks like a doodle, actually skips past anything currently pending
  // (ntfy.sh has no bulk-delete API for a third party, so this makes the next
  // notebook connection start "now" - anything published before this moment
  // will never be delivered to this device again, permanently)
  wipeDoodle.addEventListener('click', (e)=>{
    e.preventDefault();
    wipeDoodle.classList.remove('zapped');
    void wipeDoodle.offsetWidth;
    wipeDoodle.classList.add('zapped');
    const now = Math.floor(Date.now() / 1000);
    entrySince = String(now);
    setCutoff(now);
  });

  function unlockLanding(){
    pinScreen.style.display = 'none';
    landing.style.display = 'block';
  }

  // --- decoy PINs: genuinely plain, persistent, single-device notes tools.
  // nothing here is shared or ephemeral - each PIN gets its own isolated
  // vault, so 0283's notes and 0725's notes never mix.
  let activeRealNotesKey = null;
  const realPad = document.getElementById('realPad');
  const realSheet = document.getElementById('realSheet');
  const realEmptyMsg = document.getElementById('realEmptyMsg');
  const realComposer = document.getElementById('realComposer');
  const realText = document.getElementById('realText');
  const realAddBtn = document.getElementById('realAddBtn');
  const realBack = document.getElementById('realBack');

  function loadRealNotes(){
    if(!activeRealNotesKey) return [];
    try{
      const raw = localStorage.getItem(activeRealNotesKey);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveRealNotes(list){
    if(!activeRealNotesKey) return;
    try{ localStorage.setItem(activeRealNotesKey, JSON.stringify(list)); }catch(e){}
  }

  function renderRealNotes(){
    const list = loadRealNotes();
    realSheet.querySelectorAll('.note').forEach(el => el.remove());
    if(list.length === 0){
      realEmptyMsg.style.display = 'block';
      return;
    }
    realEmptyMsg.style.display = 'none';
    list.forEach(item=>{
      const el = document.createElement('div');
      const tilt = Math.random() > 0.5 ? 'tilt-l' : 'tilt-r';
      el.className = 'note plain ' + tilt;
      el.innerHTML = '<span class="tape"></span><button class="del" type="button" aria-label="delete">×</button>';
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = item.text;
      el.appendChild(body);
      const stamp = document.createElement('span');
      stamp.className = 'stamp';
      const d = new Date(item.ts);
      stamp.textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      el.appendChild(stamp);
      el.querySelector('.del').addEventListener('click', ()=>{
        const remaining = loadRealNotes().filter(n => n.id !== item.id);
        saveRealNotes(remaining);
        renderRealNotes();
      });
      realSheet.appendChild(el);
    });
    realSheet.scrollTop = realSheet.scrollHeight;
  }

  function openRealNotes(storageKey){
    activeRealNotesKey = storageKey;
    pinScreen.style.display = 'none';
    realPad.style.display = 'flex';
    renderRealNotes();
    realText.focus();
  }

  realBack.addEventListener('click', ()=>{
    realPad.style.display = 'none';
    pinScreen.style.display = 'block';
    pinInput.value = '';
    pinError.textContent = '';
    pinInput.focus();
  });

  padClose.addEventListener('click', ()=>{
    if(mainEventSource){
      mainEventSource.close();
      mainEventSource = null;
    }
    pad.style.display = 'none';
    pinScreen.style.display = 'block';
    myId = null;
    otherId = null;
    seenIds.clear();
    sheet.querySelectorAll('.note').forEach(el => el.remove());
    emptyMsg.style.display = 'block';
    whichNote.classList.remove('awaiting');
    pinInput.value = '';
    pinError.textContent = '';
    pinInput.focus();
  });

  realComposer.addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = realText.value.trim();
    if(!val) return;
    const list = loadRealNotes();
    list.push({ id: genId(), text: val, ts: Date.now() });
    saveRealNotes(list);
    realText.value = '';
    realText.style.height = 'auto';
    renderRealNotes();
  });

  realText.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      realComposer.requestSubmit();
    }
  });
  realText.addEventListener('input', ()=>{
    realText.style.height = 'auto';
    realText.style.height = Math.min(realText.scrollHeight, 120) + 'px';
  });

  document.querySelectorAll('.book').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      enterNotebook(btn.dataset.id);
    });
  });

  function enterNotebook(id){
    myId = id;
    otherId = myId === 'A' ? 'B' : 'A';
    whichNote.textContent = (myId === 'A' ? '仕事' : 'プライベート');
    updateTurnBadge();
    landing.style.display = 'none';
    pad.style.display = 'flex';
    startPolling();
    textEl.focus();
  }

  function timeStr(ts){
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function addNote({text, ts, mine, imageUrl}){
    emptyMsg.style.display = 'none';
    const el = document.createElement('div');
    const tilt = Math.random() > 0.5 ? 'tilt-l' : 'tilt-r';
    el.className = 'note ' + (mine ? 'mine' : 'theirs') + ' ' + tilt;
    el.innerHTML = '<span class="tape"></span>';
    if(imageUrl){
      const img = document.createElement('img');
      img.src = imageUrl;
      img.alt = '';
      el.appendChild(img);
    }
    if(text){
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = text;
      el.appendChild(body);
    }
    const stamp = document.createElement('span');
    stamp.className = 'stamp';
    stamp.textContent = timeStr(ts);
    el.appendChild(stamp);
    sheet.appendChild(el);
    sheet.scrollTop = sheet.scrollHeight;
    return el;
  }

  const DISPLAY_MS = 5000; // both received and sent notes stay for a fixed 5 seconds

  function isForeground(){
    return document.visibilityState === 'visible' && document.hasFocus();
  }

  function crossOutAndRemove(el){
    el.classList.add('consuming');
    setTimeout(()=>{
      el.classList.add('tossed');
      setTimeout(()=> el.remove(), 900);
    }, 500);
  }

  function consumeNote(el, text){
    const start = ()=> setTimeout(()=> crossOutAndRemove(el), DISPLAY_MS);

    if(isForeground()){
      start();
      return;
    }
    // arrived while the tab was backgrounded/unfocused - wait until the
    // person actually comes back to look before the clock starts ticking
    const onForeground = ()=>{
      if(isForeground()){
        document.removeEventListener('visibilitychange', onForeground);
        window.removeEventListener('focus', onForeground);
        start();
      }
    };
    document.addEventListener('visibilitychange', onForeground);
    window.addEventListener('focus', onForeground);
  }

  // the sender's own copy self-destructs on the same fixed clock, independent
  // of whether the other side has read it yet
  function selfDestruct(el){
    setTimeout(()=> crossOutAndRemove(el), DISPLAY_MS);
  }

  function genId(){
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
  }

  // publish one note to the shared ntfy topic (acts as our mailbox)
  async function publishNote(note){
    try{
      await fetchTimeout(NTFY_BASE, {
        method: 'POST',
        body: JSON.stringify(note)
      });
    }catch(e){
      console.error('publish failed', e);
    }
  }

  async function addAndShare(text){
    const ts = Date.now();
    const note = { id: genId(), sender: myId, text, ts };
    const el = addNote({ text, ts, mine: true });
    selfDestruct(el);
    seenIds.add(note.id);
    noteTurn(myId, ts);
    await publishNote(note);
  }

  // --- photos: only in the 0718 chat, never in the decoy notepads ---
  const MAX_PHOTO_DIM = 1600;
  const PHOTO_QUALITY = 0.75;

  function compressImage(file){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = ()=>{
        let { width, height } = img;
        if(width > MAX_PHOTO_DIM || height > MAX_PHOTO_DIM){
          const scale = MAX_PHOTO_DIM / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob); else reject(new Error('compress failed'));
        }, 'image/jpeg', PHOTO_QUALITY);
      };
      img.onerror = (err)=>{ URL.revokeObjectURL(url); reject(err); };
      img.src = url;
    });
  }

  async function publishPhoto(blob){
    try{
      const res = await fetchTimeout(NTFY_BASE, {
        method: 'PUT',
        body: blob,
        headers: { 'X-Filename': 'photo.jpg', 'X-Title': myId }
      }, 25000); // uploads can take longer than the usual 8s timeout
      try{
        const body = await res.json();
        if(body && body.id) seenIds.add(body.id);
      }catch(err){ /* response wasn't JSON - fine, just can't pre-dedupe this one */ }
    }catch(e){
      console.error('photo publish failed', e);
    }
  }

  async function shareSelectedPhoto(file){
    photoBtn.disabled = true;
    try{
      const blob = await compressImage(file);
      const localUrl = URL.createObjectURL(blob);
      const ts = Date.now();
      const el = addNote({ ts, mine: true, imageUrl: localUrl });
      selfDestruct(el);
      setTimeout(()=> URL.revokeObjectURL(localUrl), DISPLAY_MS + 1600);
      noteTurn(myId, ts);
      await publishPhoto(blob);
    }catch(e){
      console.error('photo share failed', e);
    }finally{
      photoBtn.disabled = false;
    }
  }

  photoBtn.addEventListener('click', ()=> photoInput.click());
  photoInput.addEventListener('change', ()=>{
    const file = photoInput.files && photoInput.files[0];
    photoInput.value = '';
    if(file) shareSelectedPhoto(file);
  });

  let mainEventSource = null;

  function startPolling(){
    const url = NTFY_BASE + '/sse?since=' + encodeURIComponent(entrySince);
    mainEventSource = new EventSource(url);
    mainEventSource.onmessage = (e)=>{
      let evt;
      try{ evt = JSON.parse(e.data); }catch(err){ return; }
      if(evt.event !== 'message') return;

      // photos arrive as ntfy attachments, not our own JSON envelope
      if(evt.attachment && evt.attachment.url){
        const sender = evt.title;
        if(sender !== 'A' && sender !== 'B') return;
        const ts = evt.time * 1000;
        noteTurn(sender, ts);
        if(!seenIds.has(evt.id)){
          seenIds.add(evt.id);
          const el = addNote({ ts, mine: sender === myId, imageUrl: evt.attachment.url });
          consumeNote(el, '');
        }
        return;
      }

      let n;
      try{ n = JSON.parse(evt.message); }catch(err){ return; }
      if(!n || !n.id || !n.sender || typeof n.text !== 'string') return;
      noteTurn(n.sender, n.ts);
      if(!seenIds.has(n.id)){
        seenIds.add(n.id);
        const el = addNote({ text: n.text, ts: n.ts, mine: n.sender === myId });
        consumeNote(el, n.text);
      }
    };
    mainEventSource.onerror = ()=>{
      // the browser retries automatically; nothing else to do here
    };
  }

  composer.addEventListener('submit', (e)=>{
    e.preventDefault();
    const text = textEl.value.trim();
    if(!text) return;
    addBtn.disabled = true;
    addAndShare(text).finally(()=>{ addBtn.disabled = false; });
    textEl.value = '';
    textEl.style.height = 'auto';
  });

  textEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      composer.requestSubmit();
    }
  });

  textEl.addEventListener('input', ()=>{
    textEl.style.height = 'auto';
    textEl.style.height = Math.min(textEl.scrollHeight, 120) + 'px';
  });
})();
</script>
</body>
</html>
